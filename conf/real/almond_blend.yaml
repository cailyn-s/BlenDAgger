env: real

policy:
  policy: diffusion
  ckpt_dir: checkpoints/almond_base.ckpt

arbitration:
  teleop: oculus
  algo: combined_blend
  alpha_smoothing: 0.5
  uncertainty_method: knn
  uncertainty_path: ./BlenDAgger/arbitration/uncertainty_knn_almond.json
  knn_index_path: BlenDAgger/arbitration/knn_index_almond.pkl

motion:
  action_scale: 0.8
  collection_action_scale: 0.8

cameras:
  cameras: [orbbec1, orbbec2]
  show_cameras: true

collection:
  num_episodes: 15
  save: true
  save_images: true
  output_dir: data/almond
  task_name: almond_blend_round1
