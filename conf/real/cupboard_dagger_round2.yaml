env: real

policy:
  policy: diffusion
  ckpt_dir: checkpoints/cupboard_hg_dagger_round1.ckpt

arbitration:
  teleop: oculus
  algo: hg_dagger
  alpha_smoothing: 0.5
  button_for_intervention: True

motion:
  action_scale: 0.8
  collection_action_scale: 0.8

cameras:
  cameras: [orbbec1, orbbec2]
  show_cameras: true

collection:
  num_episodes: 15
  save: true
  save_images: true
  output_dir: data/cupboard
  task_name: cupboard_dagger_round2
