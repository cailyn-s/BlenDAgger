# @package _global_
# analysis/sim/thawing: computation here, presentation in analysis/sim/thawing/plot.yaml,
# composed by hydra's defaults list below.
defaults:
- /paths_db
- /shared/algo_colors
- /analysis/sim/thawing/plot
- _self_
hydra:
  output_subdir: null
  run:
    dir: .
model: diffusion
env_name: MicrowaveThawing
run_name: thawing
output_dir: analysis/results/thawing_sim
plot_only: false
obs_keys:
- robot0_joint_pos
angle_keys:
- robot0_joint_pos
ood:
  k_neighbors: 10
  normalize: true
trajectory:
  normalize: true
  max_pretrain_demos: null
  analyze_segments: true
  min_segment_length: 5
intervention_timing:
  # Interventions separated by fewer than 10 timesteps are merged.
  gap_threshold: 10
only_metrics: []
# BlenDAgger and HG-DAgger collections.
runs:
  hg_dagger: ${paths_db.sim_data_dir}/thawing_realmatch_hg_dagger_MicrowaveThawing
  combined_blend: ${paths_db.sim_data_dir}/thawing_realmatch_combined_blend_MicrowaveThawing
export:
  dataset: thawing_sim
  study: expert
  task: thawing
  environment: sim
  methods:
    hg_dagger: HG
    combined_blend: Blended
